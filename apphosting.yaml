# Firebase App Hosting — clefmark.com marketing site
# See c:\Clefmark\docs\marketing\MARKETING.md

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 4
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://app.clefmark.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-9V2GDKG00E
    availability:
      - BUILD
      - RUNTIME
  - variable: CONTACT_FROM_EMAIL
    value: Clefmark <contact@send.clefmark.com>
    availability:
      - RUNTIME
  - variable: CONTACT_TO_EMAIL
    value: hello@clefmark.com
    availability:
      - RUNTIME
  # Set RESEND_API_KEY in Firebase console (secret) for contact form
